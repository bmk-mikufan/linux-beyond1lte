# /etc/s10e-sleepd.conf: when the S10e sleeps (s10e-sleepd). Times in seconds; these are the defaults.
[sleep]
# false, or s10e.nosleep on the kernel command line: never sleep
enabled=true
# after the screen goes off
delay=5
# awake after a wake that was not the AOD clock (the modem, a key, the charger)
wake_hold=5
# awake after a packet on Wi-Fi woke it (IRQ brcmf_host_wake)
wifi_hold=2
# with the AOD showing: wake at every minute for this long, so it shows the new time (with the
# panel's own clock, at every hour, for the date and the battery)
aod_clock=true
aod_hold=2
# no sleep this soon after boot
boot_grace=120
# how often to look again while something holds it awake
poll=10
