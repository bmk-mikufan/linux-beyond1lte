# /etc/sysctl.d/61-s10e-hang.conf (S10e, after 60-hang-panic.conf)
# Exynos9820 has a GICv2: no pseudo-NMI, so a CPU stuck with interrupts off never answers the all-CPU backtrace,
# and the 10 s wait for it only delays the panic dump until the SoC watchdog (60 s) has reset the phone first.
kernel.hardlockup_all_cpu_backtrace = 0
