# /etc/sysctl.d/60-hang-panic.conf
# Turn a hang into a panic with a stack trace, then a reboot, instead of a silent freeze (the kernel config has the
# detectors: DETECT_HUNG_TASK, SOFTLOCKUP_DETECTOR, HARDLOCKUP_DETECTOR_BUDDY). The trace is kept by
# ramoops in pstore. A task blocked 120 s (a stalled storage write, say) counts as hung.
kernel.hung_task_timeout_secs = 120
kernel.hung_task_panic = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.panic = 10
# Every CPU's stack on a lockup, the stuck one included: the buddy detector only printed the CPU that noticed
# (CPU 7) while CPU 0 sat with interrupts off. Reaching a CPU in that state needs pseudo-NMI
# (CONFIG_ARM64_PSEUDO_NMI, boot option irqchip.gicv3_pseudo_nmi=1).
kernel.hardlockup_all_cpu_backtrace = 1
kernel.softlockup_all_cpu_backtrace = 1
