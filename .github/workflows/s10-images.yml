# Galaxy S10 (beyond1lte) Odin images: U-Boot (boot) and Ubuntu 24.04 (userdata).
# The kernel is built locally (s10/build-kernel.sh) and attached to a release first;
# this workflow takes s10-kernel-*.tar.gz from that release and adds the Odin files to it,
# one userdata image per desktop variant.
name: s10-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that carries s10-kernel-*.tar.gz"
        required: true
      variants:
        description: 'JSON list of rootfs variants: desktop, lomiri, server'
        default: '["desktop","lomiri","server"]'

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        de: ${{ fromJSON(inputs.variants) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      DE: ${{ matrix.de }}
      OUT: ${{ github.workspace }}/out-s10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            s10
            mobian/uboot
          fetch-depth: 1

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap android-sdk-libsparse-utils e2fsprogs xz-utils \
            build-essential bc bison flex device-tree-compiler libssl-dev libgnutls28-dev \
            uuid-dev swig python3-dev python3-setuptools python3-pyelftools python3-libfdt

      - name: Kernel from the release
        run: |
          mkdir -p "$OUT"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 's10-kernel-*.tar.gz' -D "$OUT"
          ls -l "$OUT"

      - name: U-Boot -> boot.img
        if: matrix.de == 'desktop'
        run: sh s10/build-uboot.sh

      - name: Ubuntu (${{ matrix.de }}) -> userdata.img
        run: sudo -E sh s10/build-rootfs.sh "$(ls "$OUT"/s10-kernel-*.tar.gz)"

      - name: Upload to the release
        run: |
          cd "$OUT"
          U=s10-ubuntu-$DE-userdata.tar.md5
          sudo chown "$(id -u):$(id -g)" $U
          xz -T0 -6 $U
          F="$U.xz"
          if [ "$DE" = desktop ]; then
            F="$F s10-uboot-boot.tar.md5 u-boot-s10.bin exynos9820-beyond1lte.dtb"
          fi
          sha256sum $F > SHA256SUMS-$DE
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber $F SHA256SUMS-$DE
