# PID 1 feeds the SoC watchdog: a stalled SoC resets within 60 s instead of needing Vol-Down+Power. 60 s leaves
# the hard-lockup panic time to dump the log to pstore first (panic=10 then reboots). Off during shutdown, so a
# slow power-off cannot turn into a reboot.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=off
WatchdogDevice=/dev/watchdog-s10
